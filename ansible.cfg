1. Templating Controls
- New options to enforce stricter Jinja2 behavior:
- jinja2_native = True → ensures native Python types are preserved in templates.
- error_on_undefined_vars = True → playbooks fail immediately if a variable is missing.
- These align with the stricter checks introduced in 2.20.x.

2. Error Handling & Execution
- any_errors_fatal can now be set globally in ansible.cfg, not just per play.
- max_fail_percentage configurable at the config level, giving cluster-wide tolerance.
- ignore_unreachable can be toggled to skip unreachable hosts instead of failing the play.

3. Strategy & Performance
- strategy_plugins_path → lets you load custom execution strategies.
- forks → improved defaults for parallelism (higher concurrency supported).
- pipelining = True → reduces SSH overhead, now recommended for performance.


4. Logging & Debugging
- display_args_to_stdout → controls whether task arguments are shown in logs.
- display_skipped_hosts → toggle visibility of skipped hosts.
- show_task_path_on_failure → shows the exact file and line number when a task fails (newer addition).


5. Inventory & Collections
- collections_paths → expanded support for multiple collection directories.
- inventory_ignore_extensions → lets you skip certain file types when loading inventory.

🛠 Example ansible.cfg (with new options)
[defaults]
inventory = ./inventory
forks = 20
pipelining = True
jinja2_native = True
error_on_undefined_vars = True
any_errors_fatal = True
max_fail_percentage = 10
show_task_path_on_failure = True
collections_paths = ./collections




